# Thin caller: the real config lives in puIad/pr-agent-workflows.
name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr-agent:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request' || github.event.issue.pull_request) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: puIad/pr-agent-workflows/.github/workflows/pr-agent.yml@main
    secrets: inherit
